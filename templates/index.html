<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>套利监控</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--card-bg:#161b22;--border:#30363d;--text:#c9d1d9;
  --muted:#8b949e;--blue:#58a6ff;--green:#3fb950;--red:#ff7b72;--yellow:#d29922;
  --btn-bg:#21262d;--btn-hover:#30363d;--input-bg:#0d1117;
  --radius:8px;--radius-sm:6px;
}
body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:20px}

/* header */
.header{background:var(--card-bg);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{font-size:17px;font-weight:600;white-space:nowrap}
.header .status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px}
.header .status-dot.paused{background:var(--yellow)}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;padding:12px 16px}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.card .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.card .value{font-size:20px;font-weight:700}
.card .value.green{color:var(--green)}.card .value.red{color:var(--red)}.card .value.blue{color:var(--blue)}.card .value.muted{color:var(--muted)}

/* table */
.table-wrapper{padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:600px}
thead th{background:var(--card-bg);color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:10px 8px;text-align:left;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:1}
thead th.center{text-align:center}
tbody td{padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td.center{text-align:center}
tbody tr:hover{background:rgba(255,255,255,0.02)}
.status-buy{color:var(--red);font-weight:600}
.status-sell{color:var(--green);font-weight:600}
.status-pending{color:var(--yellow)}
.status-error{color:var(--muted)}
tr.alert-row{background:rgba(255,123,114,0.08)}
.no-data{text-align:center;padding:30px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--btn-bg);color:var(--text);font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--btn-hover)}
.btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.tab-btn{padding:7px 16px;font-weight:600}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{padding:4px 10px;font-size:11px}

/* modal */
.modal{display:none;position:fixed;z-index:100;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.6);align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-content{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:20px;width:90%;max-width:400px;max-height:90vh;overflow-y:auto}
.modal-content h3{margin-bottom:14px;font-size:16px}
.modal-content label{display:block;margin-bottom:4px;font-size:12px;color:var(--muted)}
.modal-content input,.modal-content select{width:100%;padding:9px 10px;margin-bottom:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--input-bg);color:var(--text);font-size:13px}
.modal-content input:focus{border-color:var(--blue);outline:none}
.modal-buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}

/* settings */
.section{padding:0 16px;margin-bottom:12px}
.section-title{font-size:13px;color:var(--muted);margin-bottom:8px;cursor:pointer;user-select:none}
.section-body{display:none}
.section-body.open{display:block}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap}
.setting-row label{font-size:13px;flex:1;min-width:100px}
.setting-row input,.setting-row select{width:160px;padding:6px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--input-bg);color:var(--text);font-size:12px}

/* alert log */
.alert-log{padding:0 16px;margin-top:10px}
.alert-log .log-entry{font-family:"Cascadia Code",Consolas,monospace;font-size:10px;padding:4px 8px;border-bottom:1px solid var(--border);color:var(--muted)}

/* toggle switch */
.toggle{position:relative;display:inline-block;width:40px;height:22px}
.toggle input{display:none}
.toggle .slider{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:22px;transition:.2s;cursor:pointer}
.toggle .slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.slider{background:var(--blue)}
.toggle input:checked+.slider::before{transform:translateX(18px)}

/* spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:4px}

/* mobile tweaks */
@media(max-width:600px){
  .cards{grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px}
  .card{padding:8px 10px}.card .value{font-size:16px}
  .header h1{font-size:15px}
  table{font-size:11px}thead th{font-size:9px}p{padding:6px 4px}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <span id="statusDot" class="status-dot"></span>
    <h1 style="display:inline;vertical-align:middle">套利监控</h1>
    <span id="updateTime" style="font-size:11px;color:var(--muted);margin-left:10px"></span>
  </div>
  <div class="header-actions">
    <button class="btn tab-btn active" onclick="switchTab('monitor')" id="tabMon">📊 监控</button>
    <button class="btn tab-btn" onclick="switchTab('trading')" id="tabTrade">💰 交易</button>
    <button class="btn" onclick="showAddModal()">＋ 添加</button>
    <button class="btn" onclick="toggleSection('settingsBody')">⚙ 设置</button>
  </div>
</div>

<!-- ===== 监控 Tab ===== -->
<div id="monitorTab">

<!-- 统计卡片 -->
<div class="cards">
  <div class="card"><div class="label">标的数</div><div class="value blue" id="cardTotal">—</div></div>
  <div class="card"><div class="label">正常</div><div class="value green" id="cardNormal">—</div></div>
  <div class="card"><div class="label">告警</div><div class="value red" id="cardAlert">—</div></div>
</div>

<!-- 设置面板 -->
<div class="section" id="settingsBody" style="display:none">
  <div class="section-title" onclick="toggleSection('settingsBody')" style="font-size:14px;font-weight:600;color:var(--text)">⚙ 设置</div>
  <div class="section-body open" style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px">
    <!-- 邮箱 -->
    <div class="setting-row"><label>📧 邮箱通知</label><label class="toggle"><input type="checkbox" id="sEmailEnabled" onchange="saveSettings()"><span class="slider"></span></label></div>
    <div class="setting-row"><label>发件邮箱</label><input id="sEmailUser" placeholder="xxx@qq.com" onchange="saveSettings()"></div>
    <div class="setting-row"><label>授权码</label><input type="password" id="sEmailPass" placeholder="QQ邮箱授权码" onchange="saveSettings()"></div>
    <!-- 代理 -->
    <div class="setting-row"><label>🌐 HTTP代理</label><label class="toggle"><input type="checkbox" id="sProxyEnabled" onchange="saveSettings()"><span class="slider"></span></label></div>
    <div class="setting-row"><label>代理地址</label><input id="sProxyHttp" placeholder="http://127.0.0.1:4780" onchange="saveSettings()"></div>
    <!-- 监控 -->
    <div class="setting-row"><label>轮询间隔</label><select id="sPollInterval" onchange="saveSettings()"><option value="10">10秒</option><option value="30" selected>30秒</option><option value="60">60秒</option><option value="120">120秒</option></select></div>
    <div class="setting-row"><label>告警冷却</label><select id="sCooldown" onchange="saveSettings()"><option value="60">1分钟</option><option value="180">3分钟</option><option value="300" selected>5分钟</option><option value="600">10分钟</option></select></div>
  </div>
</div>

<!-- 表格 -->
<div class="table-wrapper"><table>
<thead><tr><th>美股</th><th>币安</th><th class="center">美股价格</th><th class="center">币安价格</th><th class="center">价差%</th><th class="center">阈值%</th><th class="center">状态</th><th class="center"></th></tr></thead>
<tbody id="tableBody"><tr><td colspan="8" class="no-data"><span class="spinner"></span>加载中...</td></tr></tbody>
</table></div>

<!-- 告警日志 -->
<div class="alert-log"><div class="section-title" onclick="toggleSection('alertLogBody')" style="font-size:12px;margin-bottom:0">📋 告警日志 (<span id="alertCount">0</span>)</div>
<div class="section-body" id="alertLogBody"></div></div>

</div><!-- /monitorTab -->

<!-- ===== 交易 Tab ===== -->
<div id="tradingTab" style="display:none">

<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(80px,1fr))">
  <div class="card"><div class="label">活跃仓位</div><div class="value blue" id="tPositions">0</div></div>
  <div class="card"><div class="label">总保证金</div><div class="value" id="tMargin" style="color:var(--yellow)">0U</div></div>
  <div class="card"><div class="label">浮盈/亏</div><div class="value" id="tPnl">$0</div></div>
  <div class="card"><div class="label">时间窗口</div><div class="value" id="tWindow" style="font-size:14px">—</div></div>
  <div class="card"><div class="label">模式</div><div class="value" id="tMode" style="font-size:13px">—</div></div>
</div>

<div style="padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap">
  <button class="btn" onclick="tradeToggle()" id="tPauseBtn">▶ 启动</button>
  <button class="btn danger" onclick="tradeEmergency()">🛑 紧急平仓</button>
  <button class="btn sm" onclick="location.reload()">🔄 刷新</button>
</div>

<div class="table-wrapper"><table>
<thead><tr><th>美股</th><th>币安</th><th>方向</th><th>状态</th><th>阶梯</th><th class="center">保证金</th><th class="center">美股$</th><th class="center">币安$</th><th class="center">价差%</th></tr></thead>
<tbody id="tradeBody"><tr><td colspan="9" class="no-data">交易引擎未启动</td></tr></tbody>
</table></div>

<div class="alert-log" style="margin-top:8px">
  <div class="section-title" style="font-size:12px">📋 交易日志</div>
  <div id="tradeLog" style="font-size:10px;color:var(--muted);max-height:120px;overflow-y:auto"></div>
</div>

</div><!-- /tradingTab -->

<!-- 添加标的弹窗 -->
<div class="modal" id="addModal">
<div class="modal-content">
<h3>➕ 添加套利对</h3>
<label>美股代码</label><input id="addStock" placeholder="如 MSTR, COIN">
<label>币安交易对</label><input id="addCrypto" placeholder="如 BTCUSDT">
<label>预警阈值(%)</label><input id="addThreshold" placeholder="0.5" value="0.5">
<div class="modal-buttons"><button class="btn" onclick="closeModal('addModal')">取消</button><button class="btn primary" onclick="addPair()">确定</button></div>
</div></div>

<script>
// ── 工具 ──
function $(id){return document.getElementById(id)}
function $$(sel){return document.querySelectorAll(sel)}

function toggleSection(id){
  const el=$(id); if(!el)return;
  const body=el.querySelector('.section-body')||el;
  const isOpen=body.classList.contains('open')||el.style.display!=='none';
  if(el.querySelector('.section-body')){body.classList.toggle('open',!isOpen)}
  else{el.style.display=isOpen?'none':'block'}
}

function showModal(id){$(id).classList.add('show')}
function closeModal(id){$(id).classList.remove('show')}

// ── API ──
async function api(url,opt={}){
  try{const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});return await r.json()}
  catch(e){console.error(e);return null}
}

// ── 刷新数据 ──
async function refresh(){
  const data=await api('/api/status');if(!data)return;
  const rs=data.results||[];
  const paused=data.paused;

  // 状态指示
  $('statusDot').className='status-dot'+(paused?' paused':'');
  $('pauseBtn').textContent=paused?'▶ 恢复':'⏸ 暂停';
  $('updateTime').textContent=data.update_time||'';

  // 卡片
  $('cardTotal').textContent=rs.length;
  let normal=0,alert=0;
  rs.forEach(r=>{
    const s=r[6]||'';
    if(s.includes('正常'))normal++;
    if(s.includes('信号')||s.includes('确认中'))alert++;
  });
  $('cardNormal').textContent=normal;
  $('cardAlert').textContent=alert;
  $('cardAlert').className='value'+(alert>0?' red':' muted');

  // 表格
  let html='';
  rs.forEach((r,i)=>{
    const stock=r[0],crypto=r[1],us=r[2],bn=r[3],diff=r[4],th=r[5],status=r[6],time=r[7];
    let cls='';let sc='';
    if(status.includes('买入信号')){sc='status-buy';cls='alert-row'}
    else if(status.includes('溢价信号')){sc='status-sell';cls='alert-row'}
    else if(status.includes('确认中'))sc='status-pending';
    else if(status.includes('异常'))sc='status-error';
    html+=`<tr class="${cls}">
      <td><b>${stock}</b></td><td>${crypto}</td>
      <td class="center">$${us}</td><td class="center">$${bn}</td>
      <td class="center">${diff}</td><td class="center">${th}</td>
      <td class="center ${sc}">${status}</td>
      <td class="center"><button class="btn danger sm" onclick="delPair(${i})" title="删除">✕</button></td></tr>`;
  });
  $('tableBody').innerHTML=html||'<tr><td colspan="8" class="no-data">暂无数据</td></tr>';
}

// ── 添加/删除 ──
async function addPair(){
  const stock=$('addStock').value.trim().toUpperCase();
  const crypto=$('addCrypto').value.trim().toUpperCase();
  const threshold=parseFloat($('addThreshold').value)||0.5;
  if(!stock||!crypto)return alert('请填写完整');
  await api('/api/pairs/add',{method:'POST',body:JSON.stringify({stock,crypto,threshold})});
  closeModal('addModal');
  $('addStock').value='';$('addCrypto').value='';
  refresh();
}

async function delPair(i){if(confirm('确定删除？')){await api('/api/pairs/delete',{method:'POST',body:JSON.stringify({index:i})});refresh()}}

// ── 暂停/恢复 ──
async function togglePause(){
  const btn=$('pauseBtn');
  const paused=btn.textContent.includes('恢复');
  const r=await api('/api/monitor/pause',{method:'POST',body:JSON.stringify({paused})});
  if(r&&r.ok)refresh();
}

// ── 设置 ──
async function loadSettings(){
  const s=await api('/api/settings');if(!s)return;
  $('sEmailEnabled').checked=s.email_enabled||false;
  $('sEmailUser').value=s.email_user||'';
  $('sEmailPass').value=s.email_pass||'';
  $('sProxyEnabled').checked=(s.proxy||{}).enabled||false;
  $('sProxyHttp').value=(s.proxy||{}).http||'';
  $('sPollInterval').value=s.poll_interval||30;
  $('sCooldown').value=s.alert_cooldown||300;
}

async function saveSettings(){
  const settings={
    email_enabled:$('sEmailEnabled').checked,
    email_user:$('sEmailUser').value.trim(),
    email_pass:$('sEmailPass').value.trim(),
    proxy:{enabled:$('sProxyEnabled').checked,http:$('sProxyHttp').value.trim(),https:$('sProxyHttp').value.trim()},
    poll_interval:parseInt($('sPollInterval').value),
    alert_cooldown:parseInt($('sCooldown').value),
    desktop_notify:true,sound_alert:true,
  };
  await api('/api/settings',{method:'POST',body:JSON.stringify(settings)});
}

// ── 告警日志 ──
async function loadAlerts(){
  const data=await api('/api/alerts');if(!data)return;
  const logs=data.alerts||[];
  $('alertCount').textContent=logs.length;
  let html='';
  logs.slice(-20).reverse().forEach(e=>{
    const icon=e.direction==='BUY'?'🔴买入':'🟢卖出';
    html+=`<div class="log-entry">[${e.time}] ${icon} ${e.stock}→${e.crypto} | $${e.us_price} vs $${e.binance_price} | ${e.diff_percent>0?'+':''}${e.diff_percent}%</div>`;
  });
  $('alertLogBody').innerHTML=html||'暂无告警';
}

// ── 交易相关 ──
function switchTab(tab){
  const isMon=tab==='monitor';
  $('monitorTab').style.display=isMon?'block':'none';
  $('tradingTab').style.display=isMon?'none':'block';
  $('tabMon').classList.toggle('active',isMon);
  $('tabTrade').classList.toggle('active',!isMon);
}

async function refreshTrading(){
  const data=await api('/api/trader/status');if(!data)return;
  const ss=data.snapshots||[];

  $('tPositions').textContent=ss.filter(s=>['active','alert_only','reversal'].includes(s.status)).length;
  let totalM=0;
  ss.forEach(s=>totalM+=(s.total_margin||0));
  $('tMargin').textContent=totalM.toFixed(0)+'U';
  $('tPnl').textContent='—'; $('tPnl').style.color='var(--muted)';
  $('tWindow').textContent=data.window_label||'?';
  $('tMode').textContent=data.mode==='testnet'?'🧪 测试网':data.mode==='live'?'💰 实盘':'—';
  $('tPauseBtn').textContent=data.paused?'▶ 启动':'⏸ 暂停';

  let html='';
  ss.forEach(s=>{
    const lvls=(s.triggered_levels||[]).map(l=>l.toFixed(1)+'%').join(',')||'—';
    let dir=s.direction||'—';
    let dirCls='';
    if(dir==='long'){dir='做多';dirCls='status-buy'}
    else if(dir==='short'){dir='做空';dirCls='status-sell'}
    let statCls='';
    if(s.status==='alert_only')statCls='status-buy';
    else if(s.status==='active')statCls='status-pending';
    html+=`<tr>
      <td><b>${s.stock||'?'}</b></td><td>${s.crypto||'?'}</td>
      <td class="center ${dirCls}">${dir}</td>
      <td class="center ${statCls}">${s.status_label||s.status||'?'}</td>
      <td class="center">${lvls}</td>
      <td class="center">${s.total_margin||0}U</td>
      <td class="center">$${s.us_price||'—'}</td>
      <td class="center">$${s.crypto_price||'—'}</td>
      <td class="center">${(s.diff||0)>0?'+':''}${(s.diff||0).toFixed(2)}%</td></tr>`;
  });
  $('tradeBody').innerHTML=html||'<tr><td colspan="9" class="no-data">暂无交易数据</td></tr>';

  // 交易日志
  const hist=await api('/api/trader/history');
  if(hist&&hist.trades){
    let logHtml='';
    hist.trades.slice(-10).reverse().forEach(t=>{
      const icon=t.direction==='long'?'🔴':'🟢';
      logHtml+=`<div class="log-entry">[${t.time}] ${icon} ${t.action} ${t.pair} ${t.margin||''}U Lv.${t.level||''}</div>`;
    });
    $('tradeLog').innerHTML=logHtml||'暂无记录';
  }
}

async function tradeToggle(){
  const data=await api('/api/trader/toggle',{method:'POST'});
  if(data)refreshTrading();
}

async function tradeEmergency(){
  if(!confirm('⚠️ 确定要市价平掉所有持仓吗？'))return;
  await api('/api/trader/emergency_close',{method:'POST'});
  refreshTrading();
}

// ── 初始化 ──
loadSettings();
refresh();
loadAlerts();
refreshTrading();
setInterval(refresh,5000);
setInterval(loadAlerts,30000);
setInterval(refreshTrading,10000);
</script>
</body>
</html>
